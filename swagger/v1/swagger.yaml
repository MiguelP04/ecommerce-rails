---
openapi: 3.0.3
info:
  title: Ecommerce Rails API
  version: v1
  description: API documentation for the Ecommerce Rails application
servers:
- url: http://localhost:3000
  description: Development server
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    error_response:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
      required:
      - success
      - error
    success_response:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        meta:
          type: object
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer
      required:
      - success
      - data
    pagination_meta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    user:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
    product_variant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
        price:
          type: string
        stock:
          type: integer
    category_ref:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    product:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        slug:
          type: string
        active:
          type: boolean
        average_rating:
          type: number
        category:
          "$ref": "#/components/schemas/category_ref"
        tags:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            "$ref": "#/components/schemas/product_variant"
        created_at:
          type: string
          format: date-time
    category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        parent_id:
          type: integer
          nullable: true
        children:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
        created_at:
          type: string
          format: date-time
    cart_item_product:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        cover_image_url:
          type: string
          nullable: true
    cart_item:
      type: object
      properties:
        id:
          type: integer
        quantity:
          type: integer
        product_variant:
          "$ref": "#/components/schemas/product_variant"
        product:
          "$ref": "#/components/schemas/cart_item_product"
        subtotal:
          type: number
    cart:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        items:
          type: array
          items:
            "$ref": "#/components/schemas/cart_item"
        total:
          type: number
        item_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    order_item:
      type: object
      properties:
        id:
          type: integer
        variant_name:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
        price:
          type: string
        subtotal:
          type: number
    order:
      type: object
      properties:
        id:
          type: integer
        total:
          type: string
        status:
          type: string
        payment_method:
          type: string
          nullable: true
        items:
          type: array
          items:
            "$ref": "#/components/schemas/order_item"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    admin_order:
      type: object
      properties:
        id:
          type: integer
        user_name:
          type: string
        user_email:
          type: string
        total:
          type: string
        status:
          type: string
        payment_method:
          type: string
          nullable: true
        items:
          type: array
          items:
            "$ref": "#/components/schemas/order_item"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    auth_token_response:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            token:
              type: string
            user:
              "$ref": "#/components/schemas/user"
paths:
  "/api/v1/admin/orders":
    get:
      summary: Listar todas las ordenes (admin)
      tags:
      - Admin - Ordenes
      security:
      - bearer_auth: []
      parameters:
      - name: status
        in: query
        required: false
        description: Filtrar por estado (pending, paid, shipped, delivered, cancelled)
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Lista de ordenes
        '401':
          description: No autorizado
  "/api/v1/admin/orders/{id}":
    parameters:
    - name: id
      in: path
      description: ID de la orden
      required: true
      schema:
        type: integer
    patch:
      summary: Actualizar estado de la orden (admin)
      tags:
      - Admin - Ordenes
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Estado de la orden actualizado
        '422':
          description: Transicion de estado invalida
        '401':
          description: No autorizado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Nuevo estado de la orden
                  enum:
                  - pending
                  - paid
                  - shipped
                  - delivered
                  - cancelled
                  example: paid
              required:
              - status
        required: true
  "/api/v1/auth/signup":
    post:
      summary: Registrar usuario
      tags:
      - Autenticacion
      parameters: []
      responses:
        '200':
          description: Usuario registrado exitosamente
        '422':
          description: Error de validacion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: user@example.com
                    password:
                      type: string
                      example: password123
                    name:
                      type: string
                      example: Juan Perez
                  required:
                  - email
                  - password
              required:
              - user
        required: true
  "/api/v1/auth/login":
    post:
      summary: Iniciar sesion
      tags:
      - Autenticacion
      parameters: []
      responses:
        '200':
          description: Inicio de sesion exitoso
        '422':
          description: Credenciales invalidas
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: password123
              required:
              - email
              - password
        required: true
  "/api/v1/auth/google":
    post:
      summary: Iniciar sesion con Google
      tags:
      - Autenticacion
      parameters: []
      responses:
        '401':
          description: Token de Google invalido
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id_token:
                  type: string
                  description: Google ID token
              required:
              - id_token
        required: true
  "/api/v1/auth/me":
    get:
      summary: Obtener perfil del usuario actual
      tags:
      - Autenticacion
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Perfil del usuario
        '401':
          description: No autorizado
  "/api/v1/auth/logout":
    post:
      summary: Cerrar sesion
      tags:
      - Autenticacion
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Sesion cerrada exitosamente
        '401':
          description: No autorizado
  "/api/v1/auth/refresh":
    post:
      summary: Renovar token
      tags:
      - Autenticacion
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Token renovado exitosamente
        '401':
          description: No autorizado
  "/api/v1/auth/forgot_password":
    post:
      summary: Solicitar restablecimiento de contrasena
      tags:
      - Autenticacion
      parameters: []
      responses:
        '200':
          description: Correo de restablecimiento enviado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
              required:
              - email
        required: true
  "/api/v1/auth/reset_password":
    post:
      summary: Restablecer contrasena
      tags:
      - Autenticacion
      parameters: []
      responses:
        '422':
          description: Token invalido o expirado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Token de restablecimiento
                new_password:
                  type: string
                  example: newpassword123
              required:
              - token
              - new_password
        required: true
  "/api/v1/cart":
    get:
      summary: Mostrar carrito
      tags:
      - Carrito
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Carrito del usuario
        '401':
          description: No autorizado
    delete:
      summary: Vaciar carrito
      tags:
      - Carrito
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Carrito vaciado
        '401':
          description: No autorizado
  "/api/v1/cart/items":
    post:
      summary: Agregar item al carrito
      tags:
      - Carrito
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: Item agregado al carrito
        '404':
          description: Variante no encontrada
        '401':
          description: No autorizado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_variant_id:
                  type: integer
                  example: 1
                quantity:
                  type: integer
                  example: 2
              required:
              - product_variant_id
              - quantity
        required: true
  "/api/v1/cart/items/{id}":
    parameters:
    - name: id
      in: path
      description: ID del item del carrito
      required: true
      schema:
        type: integer
    patch:
      summary: Actualizar cantidad del item
      tags:
      - Carrito
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Cantidad actualizada
        '401':
          description: No autorizado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  example: 3
              required:
              - quantity
        required: true
    delete:
      summary: Eliminar item del carrito
      tags:
      - Carrito
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Item eliminado del carrito
        '401':
          description: No autorizado
  "/api/v1/categories":
    get:
      summary: Listar categorias
      tags:
      - Categorias
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Lista de categorias
    post:
      summary: Crear categoria
      tags:
      - Categorias
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Categoria creada
        '401':
          description: No autorizado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Electronica
                    parent_id:
                      type: integer
                      nullable: true
                      description: ID de la categoria padre
                  required:
                  - name
              required:
              - category
        required: true
  "/api/v1/categories/{id}":
    parameters:
    - name: id
      in: path
      description: ID de la categoria
      required: true
      schema:
        type: integer
    get:
      summary: Obtener categoria
      tags:
      - Categorias
      responses:
        '200':
          description: Categoria encontrada
        '404':
          description: Categoria no encontrada
    patch:
      summary: Actualizar categoria
      tags:
      - Categorias
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Categoria actualizada
        '401':
          description: No autorizado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: object
                  properties:
                    name:
                      type: string
              required:
              - category
        required: true
    delete:
      summary: Eliminar categoria
      tags:
      - Categorias
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Categoria eliminada
        '401':
          description: No autorizado
  "/api/v1/orders":
    get:
      summary: Listar ordenes del usuario
      tags:
      - Ordenes
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Lista de ordenes
        '401':
          description: No autorizado
    post:
      summary: Crear orden desde el carrito
      tags:
      - Ordenes
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Orden creada exitosamente
        '401':
          description: No autorizado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address_id:
                  type: integer
                  description: ID de la direccion de envio
                  example: 1
                payment_method:
                  type: string
                  example: credit_card
                notes:
                  type: string
                  example: Dejar en la puerta
  "/api/v1/orders/{id}":
    parameters:
    - name: id
      in: path
      description: ID de la orden
      required: true
      schema:
        type: integer
    get:
      summary: Obtener detalle de la orden
      tags:
      - Ordenes
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Detalle de la orden
        '401':
          description: No autorizado
  "/api/v1/orders/{id}/cancel":
    parameters:
    - name: id
      in: path
      description: ID de la orden
      required: true
      schema:
        type: integer
    patch:
      summary: Cancelar orden
      tags:
      - Ordenes
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Orden cancelada
        '422':
          description: No se puede cancelar la orden
        '401':
          description: No autorizado
  "/api/v1/products":
    get:
      summary: Listar productos
      tags:
      - Productos
      parameters:
      - name: page
        in: query
        required: false
        description: Numero de pagina
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Elementos por pagina
        schema:
          type: integer
      - name: q
        in: query
        required: false
        description: Buscar por titulo o descripcion
        schema:
          type: string
      - name: category_id
        in: query
        required: false
        description: Filtrar por categoria
        schema:
          type: integer
      - name: min_price
        in: query
        required: false
        description: Precio minimo
        schema:
          type: number
      - name: max_price
        in: query
        required: false
        description: Precio maximo
        schema:
          type: number
      - name: min_rating
        in: query
        required: false
        description: Calificacion minima
        schema:
          type: number
      - name: active
        in: query
        required: false
        description: Filtrar por activo
        schema:
          type: boolean
      - name: order_by
        in: query
        required: false
        description: Campo de ordenacion (title, created_at, average_rating)
        schema:
          type: string
      - name: direction
        in: query
        required: false
        description: Direccion (asc, desc)
        schema:
          type: string
      responses:
        '200':
          description: Lista de productos
    post:
      summary: Crear producto
      tags:
      - Productos
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Producto creado
        '401':
          description: No autorizado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: object
                  properties:
                    title:
                      type: string
                      example: Nuevo Producto
                    description:
                      type: string
                      example: Descripcion del producto
                    category_id:
                      type: integer
                      example: 1
                    active:
                      type: boolean
                      example: true
                  required:
                  - title
                  - category_id
              required:
              - product
        required: true
  "/api/v1/products/{id}":
    parameters:
    - name: id
      in: path
      description: ID del producto
      required: true
      schema:
        type: integer
    get:
      summary: Obtener producto
      tags:
      - Productos
      responses:
        '200':
          description: Producto encontrado
        '404':
          description: Producto no encontrado
    patch:
      summary: Actualizar producto
      tags:
      - Productos
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Producto actualizado
        '401':
          description: No autorizado
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    active:
                      type: boolean
              required:
              - product
        required: true
    delete:
      summary: Eliminar producto
      tags:
      - Productos
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Producto eliminado
        '401':
          description: No autorizado
